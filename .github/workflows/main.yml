name: CI/CD

on: [push, pull_request]

# Copied from gameguild-gg/UnityBoilerplate (.github/workflows/main.yml).
# Works with Unity 2022.3 too: "unityVersion: auto" reads your own
# ProjectSettings/ProjectVersion.txt and uses that version.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build for WebGL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true   # needed because Anchorpoint stores big files with Git LFS

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto
          # If your Unity project is inside a subfolder of the repo
          # (you can see Assets/ is NOT at the top), uncomment and edit:
          # projectPath: MyGameFolder

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
